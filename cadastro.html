<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Indicação</title>
    <link rel="stylesheet" href="style/cadastro-style.css">
</head>

<body>
    <main class="tela-cadastro">

        <form action="">
           <h2>Cadastro</h2> 
           <div class="inputs">
                <div class="input-group">
                    <label for="Nome">Nome: </label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </div>
                <div class="input-group">

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" placeholder="Digite seu telefone">
                </div>

                <div class="input-group">

                    <label for="e-mail">E-mail:</label>
                    <input type="email" id="e-mail" placeholder="Digite seu email">
                </div>

                <div class="input-group">

                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>

            </div>
            <div class="button-group">
                <button class="cadastrar">Cadastrar</button>
                <button class="entrar">Entrar</button>
            </div>
        </form>
    </main>

</body>

</html>
